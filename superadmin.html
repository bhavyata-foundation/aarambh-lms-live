<!DOCTYPE html>

<head>

</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <button class="menu-toggle" onclick="toggleSidebar()" aria-label="Menu">☰</button>
    <span class="topbar-brand"><span class="topbar-brand-icon"><img src="assets/logo.png" alt="Bhavyata Foundation logo" class="brand-logo-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"><span class="brand-fallback-emoji">🌱</span></span><span class="brand">Bhavyata portal</span></span>
    <span class="page-label" id="pageLabel">Overview</span>
  </div>
  <div class="user-menu" id="userMenu">
    <button class="user-menu-trigger" onclick="toggleUserMenu()">
      <span class="user-avatar">SA</span>
      <span class="user-name-block">
        <span class="user-name">Super Admin</span>
        <span class="tag">Admin</span>
      </span>
      <span class="user-caret">▾</span>
    </button>
    <div class="user-dropdown hidden" id="userDropdown">
      <div class="preview-as-label">Preview as</div>
      <button onclick="previewAs('teacher')">👩‍🏫 Teacher</button>
      <button onclick="previewAs('supervisor')">📋 Supervisor</button>
      <button onclick="previewAs('parent')">👪 Parent</button>
      <div class="user-dropdown-divider"></div>
      <button onclick="location.href='backend/auth/logout.php'">Log out</button>
    </div>
  </div>
</div>

<div class="layout">
  <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-nav">
      <button class="sidebar-nav-btn active" id="navOverview" onclick="switchAdminSection('overview')">📊 Overview</button>
      <button class="sidebar-nav-btn" id="navSupervisors" onclick="switchAdminSection('supervisors')">📈 Supervisor Dashboard</button>
      <button class="sidebar-nav-btn" id="navPerformance" onclick="switchAdminSection('performance')">🎯 School Performance</button>
      <button class="sidebar-nav-btn" id="navReview" onclick="switchAdminSection('review')">📅 Quarterly Review</button>
      <button class="sidebar-nav-btn" id="navWeeklyReport" onclick="switchAdminSection('report')">🗒️ Weekly Report</button>
      <button class="sidebar-nav-btn" id="navVisits" onclick="switchAdminSection('visits')">🚗 Supervisor Visits</button>
      <button class="sidebar-nav-btn" id="navSchools" onclick="switchAdminSection('schools')">🏫 Schools & Teachers</button>
      <button class="sidebar-nav-btn" id="navAddUser" onclick="switchAdminSection('adduser')">➕ Add User</button>
      <button class="sidebar-nav-btn" id="navAccounts" onclick="switchAdminSection('accounts'); renderAccountEditor();">🔑 Edit Accounts</button>
      <button class="sidebar-nav-btn" id="navEvents" onclick="switchAdminSection('events'); renderSuperadminPTMTraining();">📌 Events</button>
    </div>
    <div id="sidebar-schools-section" class="hidden">
      <div class="sidebar-label">All Schools (23)</div>
      <div id="school-accordion-list"></div>
    </div>
  </div>

  <div class="dash dash-wide">
    <h1>Super Admin</h1>
    <p class="sub" id="adminSubheading">Overview across all schools</p>
    <div id="admin-body"></div>
  </div>
</div>

<script src="js/events-calendar.js" defer></script>
<script src="js/ptm-view.js" defer></script>
<script src="js/superadmin.js" defer></script>
<script src="js/duration-picker.js" defer></script>
<script src="js/superadmin-dashboards.js" defer></script>
<script src="js/hpc-master.js" defer></script>
<script src="js/superadmin-accounts.js?v=acc1" defer></script>
<script src="js/superadmin-content.js" defer></script>
<script>
  // The header is fixed and can be taller than the room the stylesheet leaves for it
  // (the two-line "Super Admin · Admin" block): start the page and the menu just below it.
  (function(){
    function fit(){
      const bar = document.querySelector('body > .topbar'), layout = document.querySelector('body > .layout');
      if(!bar || !layout) return;
      const pos = getComputedStyle(bar).position; if(pos !== 'fixed' && pos !== 'absolute') return;
      const h = Math.ceil(bar.getBoundingClientRect().height);
      layout.style.marginTop = '';
      const top = layout.getBoundingClientRect().top + window.scrollY;
      if(top < h) layout.style.marginTop = ((parseFloat(getComputedStyle(layout).marginTop) || 0) + (h - top)) + 'px';
      const side = document.getElementById('sidebar');
      if(side){ side.style.top = ''; const sp = getComputedStyle(side).position, st = parseFloat(getComputedStyle(side).top);
        if((sp === 'fixed' || sp === 'sticky') && !isNaN(st) && st < h){ side.style.top = h + 'px'; if(sp === 'fixed') side.style.maxHeight = 'calc(100vh - ' + h + 'px)'; } }
    }
    function start(){ const bar = document.querySelector('body > .topbar');
      if(bar && typeof ResizeObserver === 'function') new ResizeObserver(fit).observe(bar);
      window.addEventListener('resize', fit); fit(); }
    if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
  })();
</script>
<script>

  let saCurrentSchoolId = 1;
  let saCurrentClassId = 47;

  function renderSuperadminPTMTraining(){
    const body = document.getElementById('admin-body');
    body.innerHTML = `
      <div class="card" style="margin-bottom:14px;">
        <div class="hd"><div><h3>Viewing</h3><p class="cap">Every school's PTM and Training — for checking, not deciding.</p></div></div>
        <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:10px;">
          <div><label class="field-label-admin">School</label><select id="saTopSchoolSelect" onchange="saOnTopSchoolChange()"><option>Loading…</option></select></div>
          <div><label class="field-label-admin">Division</label><select id="saTopDivisionSelect" onchange="saOnTopDivisionChange()">
            <option value="">All</option>
            <option value="Jr KG">Jr KG</option>
            <option value="Sr KG">Sr KG</option>
          </select></div>
          <div><label class="field-label-admin">Class / Teacher</label><select id="saTopClassSelect" onchange="saOnTopClassChange()"><option>Select a school first</option></select></div>
        </div>
      </div>
      <div id="sa-ptm-body"></div>
    `;
    saLoadTopSchoolSelector();
  }

  let saAllClassesForSchool = [];

  async function saLoadTopSchoolSelector(){
    const sel = document.getElementById('saTopSchoolSelect');
    try{
      const res = await fetch('backend/get_schools_list.php' + window.location.search);
      const data = await res.json();
      if(data.status !== 'success' || !data.schools){ sel.innerHTML = '<option value="">Could not load schools</option>'; return; }
      sel.innerHTML = data.schools.map(s => `<option value="${s.id}">${s.name.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</option>`).join('');
      sel.value = String(saCurrentSchoolId);
      await saFetchClassesForSchool();
      saPopulateClassSelect(saCurrentClassId);
      saRenderPTMView();
    } catch(err){
      sel.innerHTML = '<option value="">Could not reach the server</option>';
    }
  }

  async function saFetchClassesForSchool(){
    const schoolId = document.getElementById('saTopSchoolSelect').value;
    try{
      const params = new URLSearchParams(window.location.search);
      params.set('school_id', schoolId);
      const res = await fetch('backend/get_classes_for_Schools.php?' + params.toString());
      const data = await res.json();
      saAllClassesForSchool = (data.status === 'success' && data.classes) ? data.classes : [];
    } catch(err){
      saAllClassesForSchool = [];
    }
  }

  function saPopulateClassSelect(preselectClassId){
    const classSel = document.getElementById('saTopClassSelect');
    const division = document.getElementById('saTopDivisionSelect').value;
    const escHtml = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const filtered = division ? saAllClassesForSchool.filter(c => (c.name || '').toLowerCase().includes(division.toLowerCase())) : saAllClassesForSchool;
    if(!filtered.length){
      classSel.innerHTML = `<option value="">${saAllClassesForSchool.length ? 'No ' + escHtml(division) + ' classes here' : 'No classes at this school yet'}</option>`;
      saCurrentClassId = null;
      return;
    }
    classSel.innerHTML = filtered.map(c => `<option value="${c.id}">${escHtml(c.name || 'Unnamed class')} — ${escHtml(c.teacher_name || 'Unassigned')}</option>`).join('');
    if(preselectClassId && [...classSel.options].some(o => o.value === String(preselectClassId))) classSel.value = String(preselectClassId);
    saCurrentClassId = classSel.value ? parseInt(classSel.value, 10) : null;
  }

  async function saOnTopSchoolChange(){
    saCurrentSchoolId = parseInt(document.getElementById('saTopSchoolSelect').value, 10);
    document.getElementById('saTopDivisionSelect').value = '';
    await saFetchClassesForSchool();
    saPopulateClassSelect(null);
    saRenderPTMView();
  }

  function saOnTopDivisionChange(){
    saPopulateClassSelect(null);
    saRenderPTMView();
  }

  function saOnTopClassChange(){
    const classSel = document.getElementById('saTopClassSelect');
    saCurrentClassId = classSel.value ? parseInt(classSel.value, 10) : null;
    saRenderPTMView();
  }

  function saRenderPTMView(){
    renderPTMView('sa-ptm-body', {
      schoolId: saCurrentSchoolId,
      classId: saCurrentClassId,
      role: 'superadmin',
      canSchedule: false,
      showScheduleForm: false,
      canToggleTeacherPrep: false,
      canToggleSupervisorPrep: false,
      querySuffix: window.location.search
    });
  }
</script>
</body>
</html>
