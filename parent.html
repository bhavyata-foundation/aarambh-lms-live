<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bhavyata Portal — Parent</title>
<link rel="stylesheet" href="css/style-legacy.css" />
<link rel="stylesheet" href="css/style-new-design.css" />
</head>
<body>

<div id="preview-banner"></div>

<div class="topbar">
  <div class="topbar-left">
    <button class="menu-toggle" onclick="toggleSidebar()" aria-label="Menu">☰</button>
    <span class="topbar-brand"><span class="topbar-brand-icon"><img src="assets/logo.png" alt="Bhavyata Foundation logo" class="brand-logo-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"><span class="brand-fallback-emoji">🌱</span></span><span class="brand">Bhavyata portal</span></span>
    <span class="page-label" id="pageLabel">My Child</span>
  </div>
  <div class="user-menu" id="userMenu">
    <button class="user-menu-trigger" onclick="toggleUserMenu()">
      <span class="user-avatar">P</span>
      <span class="user-name-block">
        <span class="user-name" id="parentName">Parent</span>
        <span class="tag">Parent</span>
      </span>
      <span class="user-caret">▾</span>
    </button>
    <div class="user-dropdown hidden" id="userDropdown">
      <button onclick="fetch('backend/auth/logout.php').finally(() => location.href='index.html?no_dev=1')">Log out</button>
    </div>
  </div>
</div>

<div class="layout">
<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>
<div class="sidebar" id="sidebar">
  <div class="sidebar-nav">
    <button class="sidebar-nav-btn active" id="navMyChild" onclick="switchParentView('mychild')">👧 <span>My Child</span></button>
    <button class="sidebar-nav-btn" id="navCoEducator" onclick="switchParentView('coeducator')">🤝 <span>Join as Co-Educator</span></button>
  </div>
</div>

<div class="dash">
  <h1>My Child</h1>
  <p class="sub" id="parent-subheading">Parent view</p>

  <div id="parent-mychild-body">
    <p class="cap">Loading…</p>
  </div>

  <div id="parent-coeducator-body" class="hidden"></div>
</div>
</div>

<script src="js/parent-committee.js" defer></script>
<script src="js/parent.js" defer></script>
<script src="js/parent-portal.js" defer></script>
</body>
</html>
